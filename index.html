<!doctype html><html><head><meta charset="utf-8"><title>Playtest builds</title>
<style>html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px sans-serif}#bar{position:fixed;top:0;left:0;right:0;z-index:2;padding:6px;background:#0008}canvas{display:block;width:100%;height:100%}</style></head>
<body><div id="bar"><select id="pick"></select> <span id="st"></span></div><canvas id="canvas"></canvas>
<script>
(async()=>{
 const v=await (await fetch('versions.json',{cache:'no-store'})).json();
 const b=v.builds.slice().sort((a,b)=>b.date.localeCompare(a.date)); const want=location.hash.slice(1)||b[0].id;
 const cur=b.find(x=>x.id===want)||b[0]; const pick=document.getElementById('pick');
 for(const x of b){const o=new Option(`${x.date} ${x.game} ${x.id}: ${x.title}`,x.id);o.selected=x===cur;pick.add(o);}
 pick.onchange=()=>{location.hash=pick.value;location.reload();};
 const eng=`engine/${cur.engine}/`; const s=document.createElement('script'); s.src=eng+'index.js';
 s.onload=()=>{const st=document.getElementById('st');
  const e=new Engine({executable:eng+'index',mainPack:cur.pck,canvasResizePolicy:2,focusCanvas:true,ensureCrossOriginIsolationHeaders:false,args:[]});
  e.startGame({onProgress:(c,t)=>st.textContent=t?`loading ${Math.round(100*c/t)}%`:'loading'}).then(()=>st.textContent=cur.id+" - "+cur.summary,err=>st.textContent='error: '+err);};
 document.head.appendChild(s);
})();
</script></body></html>
